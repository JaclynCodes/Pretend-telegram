# version: "2"  # Commented out as it's not needed for newer golangci-lint versions
run:
  concurrency: 4
  tests: true
linters:
  enable:
    - bodyclose
    - gocritic
    - gosec
    - makezero
    - misspell
    - nakedret
    - revive

issues:
  exclude-dirs:
    - vendor
    - third_party
    - builtin
    - examples
  exclude-files:
    - ".*\\.pb\\.go$"
  exclude-generated: strict

linters-settings:
  staticcheck:
    checks:
      - "all"
      - -QF1008
      - -ST1000
